name: collect

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install feedparser requests pyyaml openpyxl
      - name: Collect
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python3 scripts/1029_collect.py --source all
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/1029-articles.json data/1029-articles.xlsx
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update press articles"
            git push
          fi
